<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Zayoor</title>
<meta name="description" content="Zayoor - trendy gadgets, fitness gear, bags and skin care. Cash on delivery.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234338ca'/%3E%3Cpath d='M9 11h14l1 12H8z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M12.5 11a3.5 3.5 0 0 1 7 0' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="auth-wrap"><div class="auth-card">
<h1 id="title">Welcome back</h1><p class="sub" id="sub"></p>
<div class="tabs" role="tablist"><button type="button" data-tab="login" class="on">Log in</button><button type="button" data-tab="register">Sign up</button></div>
<form id="loginForm" novalidate><div class="msg err" hidden></div>
<div class="field"><label for="le">Email</label><input class="input" id="le" name="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="lp">Password</label><input class="input" id="lp" name="password" type="password" autocomplete="current-password" required></div>
<button class="btn btn-block" type="submit">Log in</button></form>
<form id="registerForm" hidden novalidate><div class="msg err" hidden></div>
<div class="field"><label for="rn">Full name</label><input class="input" id="rn" name="name" autocomplete="name" required maxlength="80"></div>
<div class="field"><label for="re">Email</label><input class="input" id="re" name="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="rp">Password</label><input class="input" id="rp" name="password" type="password" autocomplete="new-password" minlength="8" required><small>At least 8 characters.</small></div>
<button class="btn btn-block" type="submit">Create account</button></form>
</div></div>
</main>
<div id="site-footer"></div>
<script src="/js/app.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
