<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop | Zayoor</title>
<meta name="description" content="Zayoor - trendy gadgets, fitness gear, bags and skin care. Cash on delivery.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234338ca'/%3E%3Cpath d='M9 11h14l1 12H8z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M12.5 11a3.5 3.5 0 0 1 7 0' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="container"><div class="page-head"><div class="crumbs"><a href="/">Home</a> / Shop</div><h1 id="shopTitle">All products</h1></div>
<div class="shop-layout">
<aside class="filters" id="filters"><form id="filterForm">
  <h3>Search</h3><input class="input" id="fSearch" type="search" placeholder="Search..." maxlength="80">
  <h3>Category</h3><div id="catList"></div>
  <h3>Price (Rs.)</h3><div class="price-range"><input class="input" id="fMin" type="number" min="0" placeholder="Min"><span>-</span><input class="input" id="fMax" type="number" min="0" placeholder="Max"></div>
  <h3>Availability</h3><label class="opt"><span class="lbl"><input type="checkbox" id="fStock">In stock only</span></label>
  <button class="btn btn-block" style="margin-top:16px" type="submit">Apply filters</button>
  <button class="btn btn-ghost btn-block" style="margin-top:6px" type="button" id="clear">Clear all</button>
</form></aside>
<div><div class="toolbar"><span class="count" id="count">&nbsp;</span>
  <div style="display:flex;gap:10px"><button class="btn btn-outline btn-sm filter-toggle" id="filterToggle" type="button">Filters</button>
  <label class="sr-only" for="sort">Sort by</label><select class="select sm" id="sort"><option value="newest">Newest</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="name">Name A-Z</option></select></div></div>
  <div class="grid shop" id="grid"></div><div class="pager" id="pager"></div></div>
</div></div>
</main>
<div id="site-footer"></div>
<script src="/js/app.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
