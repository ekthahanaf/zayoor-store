<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My account | Zayoor</title>
<meta name="description" content="Zayoor - trendy gadgets, fitness gear, bags and skin care. Cash on delivery.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234338ca'/%3E%3Cpath d='M9 11h14l1 12H8z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M12.5 11a3.5 3.5 0 0 1 7 0' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="container"><div class="page-head"><h1 id="hello">My account</h1></div>
<div class="two-col" style="padding:18px 0 56px">
<div><h2 style="margin-bottom:14px">My orders</h2><div id="orders"><div class="skel" style="min-height:140px"></div></div></div>
<div><form class="panel" id="profileForm" style="margin-bottom:20px"><h2>Profile &amp; delivery details</h2><div class="msg" hidden></div>
<div class="field"><label for="pn">Full name</label><input class="input" id="pn" name="name" required maxlength="80"></div>
<div class="field"><label for="pp">Phone</label><input class="input" id="pp" name="phone" type="tel" maxlength="20"></div>
<div class="field"><label for="pa">Address</label><textarea class="textarea" id="pa" name="address" maxlength="250"></textarea></div>
<div class="field"><label for="pc">City</label><input class="input" id="pc" name="city" maxlength="60"></div>
<button class="btn" type="submit">Save changes</button></form>
<form class="panel" id="passForm"><h2>Change password</h2><div class="msg" hidden></div>
<div class="field"><label for="cp">Current password</label><input class="input" id="cp" name="current" type="password" autocomplete="current-password" required></div>
<div class="field"><label for="np">New password</label><input class="input" id="np" name="next" type="password" autocomplete="new-password" minlength="8" required></div>
<button class="btn" type="submit">Update password</button></form></div></div></div>
</main>
<div id="site-footer"></div>
<script src="/js/app.js"></script>
<script src="/js/account.js"></script>
</body>
</html>
